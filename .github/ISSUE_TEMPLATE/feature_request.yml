name: Mejora
description: Proponer una idea o mejora
title: "[mejora] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema o necesidad
      description: Qué te gustaría resolver.
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
      description: Cómo crees que debería funcionar.
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
      description: Opcional.
